name: signed macOS release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        default: stable
        required: true
      version:
        description: Release version (empty uses Cargo.toml)
        required: false

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: macos-latest
    timeout-minutes: 25
    # Both architectures are built here rather than one per manual dispatch: the
    # Homebrew formula carries a checksum for each, so a release missing one
    # leaves half of the people installing from the landing page on an old
    # build. Signing a cross-built executable still happens on macOS, which is
    # where codesign runs.
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # Publish this certificate SHA-1 fingerprint as a repository variable.
      # The corresponding Developer ID private key remains in encrypted secrets.
      RUNE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Add the release target
        run: rustup target add ${{ matrix.target }}

      - name: Import the release signing certificate into a temporary keychain
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_keychain="$RUNNER_TEMP/rune-release.keychain-db"
          test -n "$RUNE_SIGNING_IDENTITY"
          test -n "$CERTIFICATE_P12"
          test -n "$CERTIFICATE_PASSWORD"
          signing_password=$(openssl rand -hex 32)
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/rune-signing.p12"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$RUNNER_TEMP/rune-signing.p12" -k "$signing_keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"
          rm "$RUNNER_TEMP/rune-signing.p12"

      - name: Test native certificate verification and tamper rejection
        run: cargo test -p xtask --test macos_signing -- --include-ignored

      - name: Sign and check the exact packaged executable
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # An empty version input means the workspace manifest decides, and the
          # target is always passed explicitly so one leg cannot silently build
          # the other architecture.
          version="${RELEASE_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}"
          test -n "$version"
          cargo xtask release "$RELEASE_CHANNEL" "$version" "${{ matrix.target }}" --sign-identity "$RUNE_SIGNING_IDENTITY"
          cargo xtask verify-release "target/dist/rune-${{ matrix.target }}/manifest.json" "$RUNE_SIGNING_IDENTITY"

      - name: Upload the verified signed archive, checksum and published identity
        uses: actions/upload-artifact@v4
        with:
          name: rune-signed-macos-${{ matrix.target }}
          path: target/dist/rune-${{ matrix.target }}/*
          if-no-files-found: error

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/rune-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/rune-signing.p12"

  publish-release:
    needs: signed-release
    if: inputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect the signed artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release from the signed artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          # The tag comes from the archives themselves, so the release can only
          # be named after something that was actually signed in this run.
          version=$(basename "$(ls dist/rune-*-aarch64-apple-darwin.tar.gz | head -1)" | sed 's/^rune-\(.*\)-aarch64-apple-darwin\.tar\.gz$/\1/')
          test -n "$version"
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" dist/* --clobber
          else
            gh release create "v$version" dist/* --title "Rune v$version" --generate-notes
          fi
