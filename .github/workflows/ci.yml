name: ci

# Every push and pull request runs what this repository cannot check on a
# developer's Mac: Linux (format, lint, the full suite with the PTY gate and the
# bubblewrap sandbox) and Windows, plus the size and startup budget the site
# promises for every pull request. The rest runs locally through
# `scripts/preflight.sh` before a push, and here on demand from the Actions tab
# (`workflow_dispatch`), which is how a release is checked in full.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Cheap lane: runs on every push. Node bindings, format, lint, and workspace tests.
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Node bindings
        run: node --test bindings/node/test.mjs

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fast-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: fast-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install the sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu's AppArmor user-namespace restriction can block bwrap.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Require live Linux network isolation and source editing
        if: runner.os == 'Linux'
        env:
          RUNE_REQUIRE_LINUX_SANDBOX: '1'
        run: cargo test -p rune-exec --test linux_network live_linux_network_isolation -- --exact --nocapture

      - name: Check PTY replay prerequisites
        run: python3 -c "import fcntl, pty, termios"

      - name: Test workspace including the real PTY replay gate
        run: cargo test --workspace

  wasm:
    name: WASM build and smoke test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the pinned toolchain and WASI target
        run: rustup target add wasm32-wasip1

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Build rune-web for WASI and verify the committed demo module
        run: cargo xtask verify-web

      - name: Smoke-test the exported WASM boundary with a fixture prompt
        run: node .github/scripts/test-wasm.mjs target/wasm32-wasip1/release/rune_web.wasm

  # Size, startup, prompt, and tool schema budgets. Runs on every push to main
  # as well as on a pull request, so a direct push cannot regress them unmeasured.
  # The size and startup ceilings are what the site promises every pull
  # request checks, so this one runs on every push. It takes about a minute.
  budget:
    name: budget
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: budget-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: budget-${{ runner.os }}-

      - name: Check size, startup, and dependency duplication
        run: cargo xtask budget

  # Compare binaries and archives from two independent clean release builds.
  reproducible:
    name: reproducible
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Build independently and compare extracted binaries and archives
        run: bash .github/scripts/check-reproducible-release.sh

      - name: Smoke-test the documented archive install and uninstall path
        run: python3 .github/scripts/test-archive-install.py target/dist/*/*.tar.gz

  cross-platform:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Tracked in issue 13; make these gate once both are green.
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Linux is covered by `fast`. macOS is the development machine, so it
        # runs here only on demand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["macos-latest", "windows-latest"]') || fromJSON('["windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for Windows archive tests
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-

      - name: Install the sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu's AppArmor user-namespace restriction can block bwrap.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Require live Linux network isolation and source editing
        if: runner.os == 'Linux'
        env:
          RUNE_REQUIRE_LINUX_SANDBOX: '1'
        run: cargo test -p rune-exec --test linux_network live_linux_network_isolation -- --exact --nocapture

      - name: Check PTY replay prerequisites
        if: runner.os != 'Windows'
        run: python3 -c "import fcntl, pty, termios"

      - name: Test workspace including the real PTY replay gate on Unix
        env:
          # The ACP child/fixture test stamps every frame, phase, and deadline
          # on one clock and flushes each line to stderr. Turning off libtest
          # capture puts those lines in the job log as they happen, so a run
          # that stalls at a deadline (rather than unwinding) still explains
          # which side stalled and how far the other side had got.
          RUST_TEST_NOCAPTURE: '1'
        run: cargo test --workspace

      - name: Stage native release with artifact size and startup measurements
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          rm -rf target/dist
          cargo xtask release dev

      - name: Extract Windows ZIP and smoke-test executable replacement
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: python .github/scripts/test-windows-release.py target/dist/*/*.zip

      - name: Publish measured release artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rune-${{ runner.os }}-${{ runner.arch }}
          path: target/dist/rune-*/*
          if-no-files-found: error
