name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  dependencies:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked

      - name: Check dependency advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Test dependency policy enforcement
        run: bash .github/scripts/test-dependency-policy.sh

  # Cheap lane: runs on every push. Node bindings, format, lint, and workspace tests.
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Node bindings
        run: node --test bindings/node/test.mjs

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fast-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: fast-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install the sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu's AppArmor user-namespace restriction can block bwrap.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Require live Linux network isolation and source editing
        if: runner.os == 'Linux'
        env:
          RUNE_REQUIRE_LINUX_SANDBOX: '1'
        run: cargo test -p rune-exec --test linux_network live_linux_network_isolation -- --exact --nocapture

      - name: Check PTY replay prerequisites
        run: python3 -c "import fcntl, pty, termios"

      - name: Test workspace including the real PTY replay gate
        run: cargo test --workspace

  wasm:
    name: WASM build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the pinned toolchain and WASI target
        run: rustup target add wasm32-wasip1

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Build rune-web for WASI
        run: cargo build --release --locked -p rune-web --target wasm32-wasip1

      - name: Smoke-test the exported WASM boundary with a fixture prompt
        run: node .github/scripts/test-wasm.mjs target/wasm32-wasip1/release/rune_web.wasm

  # Gate lane: runs on a pull request. Adds budgets and every platform.
  budget:
    name: budget
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: budget-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: budget-${{ runner.os }}-

      - name: Check size, startup, and dependency duplication
        run: cargo xtask budget

  # Compare binaries and archives from two independent clean release builds.
  reproducible:
    name: reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Build independently and compare extracted binaries and archives
        run: bash .github/scripts/check-reproducible-release.sh

  cross-platform:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-

      - name: Install the sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu's AppArmor user-namespace restriction can block bwrap.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Require live Linux network isolation and source editing
        if: runner.os == 'Linux'
        env:
          RUNE_REQUIRE_LINUX_SANDBOX: '1'
        run: cargo test -p rune-exec --test linux_network live_linux_network_isolation -- --exact --nocapture

      - name: Check PTY replay prerequisites
        if: runner.os != 'Windows'
        run: python3 -c "import fcntl, pty, termios"

      - name: Test workspace including the real PTY replay gate on Unix
        run: cargo test --workspace
