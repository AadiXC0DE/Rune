[package]
name = "rune-context"
description = "Project instructions, skills, MCP client, and prompt assembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rune-core = { workspace = true }
# A spawned helper is isolated the same way a command is: it gets a resolved
# environment rather than this process's, and its own process group.
rune-exec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
sha2 = { workspace = true }

# The blocking client the remote MCP transports speak through. Absent where a
# socket cannot be opened, because nothing there compiles it.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "mcp-fixture"
path = "tests/fixtures/mcp_server.rs"
