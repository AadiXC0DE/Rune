[package]
name = "rune-exec"
description = "Command execution, process supervision, and platform sandboxing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rune-core = { workspace = true }
camino = { workspace = true }

# Resource ceilings and Linux PTYs use safe rustix syscall wrappers, keeping
# the unsafe surface to the one child setup `pre_exec` call.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

# Linux PTYs reuse rustix rather than adding a terminal runtime dependency.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["pty", "termios", "stdio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
