[package]
name = "rune-sdk"
description = "Embeddable agent library for Rust hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "sdk", "coding-agent", "embedding"]

[lints]
workspace = true

[dependencies]
rune-core = { workspace = true }
# A spawned helper is isolated the same way a command is: it gets a resolved
# environment rather than this process's, and its own process group.
rune-exec = { workspace = true }
rune-agent = { workspace = true }
rune-net = { workspace = true }
rune-policy = { workspace = true }
# The workspace snapshots an embedder can turn on.
rune-session = { workspace = true }
camino = { workspace = true }
rune-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { workspace = true }

[dev-dependencies]
rune-testkit.workspace = true
tempfile.workspace = true

[[bin]]
name = "plugin-fixture"
path = "tests/fixtures/plugin.rs"
