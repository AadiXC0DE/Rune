[package]
name = "rune-session"
description = "Append-only session event log, session store, trees, the usage ledger, and workspace snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "session", "event-log", "snapshot"]

[lints]
workspace = true

[dependencies]
rune-core = { workspace = true }
# The snapshot store runs git as a supervised command with a deadline, and
# keys a workspace by the canonical path the trust store also uses.
rune-exec = { workspace = true }
rune-policy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
proptest = "1"
