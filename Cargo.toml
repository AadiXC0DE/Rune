[workspace]
resolver = "3"
members = [
    "crates/rune-core",
    "crates/rune-net",
    "crates/rune-policy",
    "crates/rune-exec",
    "crates/rune-tools",
    "crates/rune-agent",
    "crates/rune-session",
    "crates/rune-context",
    "crates/rune-term",
    "crates/rune-acp",
    "crates/rune-sdk",
    "crates/rune-testkit",
    "crates/rune",
    "xtask",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/rune-sh/rune"
authors = ["Rune contributors"]

[workspace.dependencies]
# Internal
rune-core = { path = "crates/rune-core", version = "0.1.6" }
rune-net = { path = "crates/rune-net", version = "0.1.6" }
rune-policy = { path = "crates/rune-policy", version = "0.1.6" }
rune-exec = { path = "crates/rune-exec", version = "0.1.6" }
rune-tools = { path = "crates/rune-tools", version = "0.1.6" }
rune-agent = { path = "crates/rune-agent", version = "0.1.6" }
rune-session = { path = "crates/rune-session", version = "0.1.6" }
rune-context = { path = "crates/rune-context", version = "0.1.6" }
rune-term = { path = "crates/rune-term", version = "0.1.6" }
rune-acp = { path = "crates/rune-acp", version = "0.1.6" }
rune-sdk = { path = "crates/rune-sdk", version = "0.1.6" }
rune-testkit = { path = "crates/rune-testkit", version = "0.1.6" }

# Compression
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
toml = "0.9"

# Errors
thiserror = "2"
anyhow = "1"

# CLI
lexopt = "0.3"

# Paths and identifiers
camino = { version = "1", features = ["serde1"] }
same-file = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Network. A blocking client keeps the async runtime off the command path
# entirely; the streaming read loop needs no executor.
ureq = { version = "3", default-features = false, features = ["rustls", "json", "socks-proxy"] }

# Terminal
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
unicode-width = "0.2"
unicode-segmentation = "1"

# Search
ignore = "0.4"
globset = "0.4"
regex = "1"

# Time
jiff = { version = "0.2", default-features = false }

# Hashing
sha2 = "0.10"
getrandom = "0.2"

# Dev
insta = { version = "1", features = ["json"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"
single_use_lifetimes = "warn"
unused_lifetimes = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noise on intentional designs.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
# A default table lists every variant with its own value, so identical bodies
# are the point rather than a mistake.
match_same_arms = "allow"
# Tests index fixed fixtures and use expect for the failing assertion message.
indexing_slicing = "allow"
# Small types are copied by value deliberately; the alternative is noise.
trivially_copy_pass_by_ref = "allow"
# Enumerating every value is clearer than a glob in several tables.
wildcard_imports = "allow"
# Command handlers share one signature so dispatch stays uniform, even where a
# handler cannot fail yet.
unnecessary_wraps = "allow"
# Correctness guards we do want in shipped code. Tests assert by panicking, so
# these are re-enabled for the library and binary targets only.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Parsers and the VT engine need wrapping arithmetic in narrow, reviewed
# places. Kept as a warning so the corruption suite stays the real check.
arithmetic_side_effects = "warn"
# An error that carries structured detail is worth more than a smaller one, and
# the common case is already boxed.
result_large_err = "allow"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
