[workspace]
resolver = "3"
members = [
    "crates/rune-core",
    "crates/rune-net",
    "crates/rune-policy",
    "crates/rune-exec",
    "crates/rune-tools",
    "crates/rune-agent",
    "crates/rune-session",
    "crates/rune-context",
    "crates/rune-term",
    "crates/rune-acp",
    "crates/rune-sdk",
    "crates/rune-testkit",
    "crates/rune",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/rune-sh/rune"
authors = ["Rune contributors"]

[workspace.dependencies]
# Internal
rune-core = { path = "crates/rune-core", version = "0.1.0" }
rune-net = { path = "crates/rune-net", version = "0.1.0" }
rune-policy = { path = "crates/rune-policy", version = "0.1.0" }
rune-exec = { path = "crates/rune-exec", version = "0.1.0" }
rune-tools = { path = "crates/rune-tools", version = "0.1.0" }
rune-agent = { path = "crates/rune-agent", version = "0.1.0" }
rune-session = { path = "crates/rune-session", version = "0.1.0" }
rune-context = { path = "crates/rune-context", version = "0.1.0" }
rune-term = { path = "crates/rune-term", version = "0.1.0" }
rune-acp = { path = "crates/rune-acp", version = "0.1.0" }
rune-sdk = { path = "crates/rune-sdk", version = "0.1.0" }
rune-testkit = { path = "crates/rune-testkit", version = "0.1.0" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
toml = "0.9"

# Errors
thiserror = "2"
anyhow = "1"

# CLI
lexopt = "0.3"

# Paths and identifiers
camino = { version = "1", features = ["serde1"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Async and network
tokio = { version = "1", default-features = false }
bytes = "1"
futures-util = { version = "0.3", default-features = false }

# Terminal
crossterm = { version = "0.29", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1"

# Search
ignore = "0.4"
globset = "0.4"
regex = "1"

# Time
jiff = { version = "0.2", default-features = false }

# Hashing
sha2 = "0.10"

# Dev
insta = { version = "1", features = ["json"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
rust_2018_idioms = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noise on intentional designs.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
# Correctness guards we do want.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Parsers and the VT engine need slicing and wrapping arithmetic in narrow,
# reviewed places. Kept as warnings so the corruption suite is the real check.
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
